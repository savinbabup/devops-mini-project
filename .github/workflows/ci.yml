name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t visitor-counter .

  integration:
    runs-on: ubuntu-latest
    needs: docker
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_NAME: myapp
      DB_USER: admin
      DB_PASSWORD: testpassword
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start the app
        run: nohup python app.py > app.log 2>&1 &
      - name: Wait for the app
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not start in time"
          cat app.log
          exit 1
      - name: Check home page
        run: curl -sf http://localhost:5000/ | grep "visitor number"
      - name: Check metrics
        run: curl -sf http://localhost:5000/metrics | grep app_visits_total
      - name: Post a guestbook message
        run: curl -si -X POST -d "name=CI&message=hello from CI" http://localhost:5000/message | grep -i "302"
